# PullHire api-gateway (docs/architecture.md §3.2).
# TLS termination, routing to the eight services, static rate-limit,
# X-Request-Id propagation and a static /docs index of service OpenAPI specs.

# Static rate-limit definition (http context via conf.d include).
limit_req_zone $binary_remote_addr zone=api_gateway:10m rate=10r/s;

# Propagate an incoming X-Request-Id or generate one per request.
map $http_x_request_id $pullhire_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Redirect plain HTTP to HTTPS; HTTPS routes are available for local dev too.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Self-signed demo certificate generated by the container entrypoint.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    limit_req zone=api_gateway burst=20 nodelay;

    add_header X-Request-Id $pullhire_request_id always;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $pullhire_request_id;

    # Static documentation index (docs/architecture.md §3.2).
    location = /docs {
        return 301 /docs/;
    }
    location = / {
        return 302 /docs/;
    }
    location /docs/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /docs/index.html;
    }

    # Per-service OpenAPI specs proxied for the /docs index.
    location = /openapi/auth         { proxy_pass http://auth-service:8080/v3/api-docs; }
    location = /openapi/candidate    { proxy_pass http://candidate-service:8080/v3/api-docs; }
    location = /openapi/fsp          { proxy_pass http://fsp-service:8080/v3/api-docs; }
    location = /openapi/assessment   { proxy_pass http://assessment-service:8080/v3/api-docs; }
    location = /openapi/selection    { proxy_pass http://selection-service:8080/v3/api-docs; }
    location = /openapi/employer     { proxy_pass http://employer-service:8080/v3/api-docs; }
    location = /openapi/outreach     { proxy_pass http://outreach-service:8080/v3/api-docs; }
    location = /openapi/notification { proxy_pass http://notification-service:8080/v3/api-docs; }

    # Business routes (docs/api.md §3). Longest-prefix ordering keeps the nested
    # /candidate/fsp/* path on fsp-service.
    location /auth/          { proxy_pass http://auth-service:8080; }
    location /candidate/fsp/ { proxy_pass http://fsp-service:8080; }
    location /candidate/     { proxy_pass http://candidate-service:8080; }
    location /assessment/    { proxy_pass http://assessment-service:8080; }
    location /catalog/       { proxy_pass http://selection-service:8080; }
    location = /candidates   { proxy_pass http://selection-service:8080; }
    location /candidates     { proxy_pass http://selection-service:8080; }
    location /selections     { proxy_pass http://selection-service:8080; }
    location /employer/      { proxy_pass http://employer-service:8080; }
    location /invitations/   { proxy_pass http://outreach-service:8080; }
    location /notifications  { proxy_pass http://notification-service:8080; }
}
