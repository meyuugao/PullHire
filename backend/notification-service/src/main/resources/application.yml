server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: notification-service
  # DataSource/Flyway (docs/architecture.md §5.2); values are 12-factor
  # placeholders sourced from .env (docs/deployment.md §4).
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://postgres:5432/pullhire?currentSchema=notification}
    username: ${NOTIFICATION_DB_ROLE:notification_service}
    password: ${NOTIFICATION_DB_PASSWORD:change-me-notification}
  # Per-schema migrations: one folder per service schema (docs/data_model.md §1).
  flyway:
    enabled: true
    locations: classpath:db/migration/notification
    default-schema: notification
    schemas: notification
  # SMTP target (dev = Mailpit). `from` is the envelope sender for outbound mail.
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    from: ${SMTP_FROM:no-reply@pullhire.local}
  # Event broker (docs/architecture.md §4.2); consumer with its own queue/binding.
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:pullhire}
    password: ${RABBITMQ_DEFAULT_PASS:change-me-rabbitmq}

auth:
  # Local RS256 verification via cached JWKS (docs/architecture.md §6.1); no per-request auth call.
  jwks-url: ${AUTH_JWKS_URL:http://auth-service:8080/.well-known/jwks.json}

app:
  # Public SPA base URL, used to build email links (verify-email).
  base-url: ${APP_BASE_URL:http://localhost:3000}

# Event consumer reliability (S2): retry/DLQ + correlation MDC are provided by
# event-lib's auto-configuration (ConsumerRetryConfig). This service does not
# publish, so the outbox relay (and its scheduler) is disabled — no outbox_events
# table exists in the notification schema.
pullhire:
  outbox:
    enabled: false

management:
  endpoints:
    web:
      # Observability (S2, docs/architecture.md §7.1): expose ONLY Prometheus
      # metrics at the literal path /metrics. Base-path `/` + path-mapping keeps
      # the public contract literal; health is served by our /healthz + /readyz.
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Structured JSON logs via Spring Boot built-in support (docs/architecture.md §7.1);
# no extra logging dependency (docs/stack.md §2).
logging:
  structured:
    format:
      console: ecs
