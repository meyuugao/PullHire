server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auth-service
  # DataSource/Flyway (docs/architecture.md §5.2); values are 12-factor
  # placeholders sourced from .env (docs/deployment.md §4).
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://postgres:5432/pullhire?currentSchema=auth}
    username: ${AUTH_DB_ROLE:auth_service}
    password: ${AUTH_DB_PASSWORD:change-me-auth}
  # Per-schema migrations: one folder per service schema (docs/data_model.md §1).
  flyway:
    enabled: true
    locations: classpath:db/migration/auth
    default-schema: auth
    schemas: auth
  # Event broker (docs/architecture.md §4.2); publisher only, no listeners in auth.
  # correlated publisher confirms let the outbox relay mark rows published only
  # after the broker acks (docs/architecture.md §4.3).
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:pullhire}
    password: ${RABBITMQ_DEFAULT_PASS:change-me-rabbitmq}
    publisher-confirm-type: correlated

app:
  # Public SPA base URL, consumed by notification-service when building email links.
  base-url: ${APP_BASE_URL:http://localhost:3000}
  # JWT TTLs (docs/architecture.md §6.1): access short-lived, refresh rotatable.
  jwt:
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}

# Event publisher reliability (S2): auth-service owns the outbox_events table
# (V5 migration), so it explicitly opts in to the event-lib outbox relay and its
# scheduler. The relay is OFF by default for every other (consumer-only) service.
pullhire:
  outbox:
    enabled: true

management:
  # Observability (S2, docs/architecture.md §7.1): expose ONLY Prometheus
  # metrics, at the literal path /metrics. Base-path `/` + path-mapping keeps
  # the public contract literal; health is served by our /healthz + /readyz.
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Structured JSON logs via Spring Boot built-in support (docs/architecture.md §7.1);
# no extra logging dependency (docs/stack.md §2).
logging:
  structured:
    format:
      console: ecs
