server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: outreach-service
  # DataSource/Flyway activation arrives in S1+ (docs/architecture.md §5.2);
  # S0 stubs stay connection-free so /healthz is robust. Values are 12-factor
  # placeholders sourced from .env (docs/deployment.md §4).
  datasource:
    url: ${OUTREACH_DB_URL:jdbc:postgresql://postgres:5432/pullhire?currentSchema=outreach}
    username: ${OUTREACH_DB_ROLE:outreach_service}
    password: ${OUTREACH_DB_PASSWORD:change-me-outreach}

management:
  # Observability (docs/architecture.md §7.1): expose ONLY Prometheus
  # metrics, at the literal path /metrics. Base-path `/` + path-mapping keeps
  # the public contract literal; health is served by our /healthz + /readyz.
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Structured JSON logs via Spring Boot built-in support (docs/architecture.md §7.1);
# no extra logging dependency (docs/stack.md §2).
logging:
  structured:
    format:
      console: ecs
