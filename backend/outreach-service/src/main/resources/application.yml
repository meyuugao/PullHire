server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: outreach-service
  # DataSource/Flyway (docs/architecture.md §5.2); values are 12-factor
  # placeholders sourced from .env (docs/deployment.md §4).
  datasource:
    url: ${OUTREACH_DB_URL:jdbc:postgresql://postgres:5432/pullhire?currentSchema=outreach}
    username: ${OUTREACH_DB_ROLE:outreach_service}
    password: ${OUTREACH_DB_PASSWORD:change-me-outreach}
  # Per-schema migrations: one folder per service schema (docs/data_model.md §1).
  flyway:
    enabled: true
    locations: classpath:db/migration/outreach
    default-schema: outreach
    schemas: outreach
  # Event broker (docs/architecture.md §4.2). outreach-service publishes
  # invitation events via the outbox relay; the correlated publisher confirms
  # let the relay mark rows published only after the broker acks
  # (docs/architecture.md §4.3).
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:pullhire}
    password: ${RABBITMQ_DEFAULT_PASS:change-me-rabbitmq}
    publisher-confirm-type: correlated

auth:
  # Local RS256 verification via cached JWKS (docs/architecture.md §6.1); no per-request auth call.
  jwks-url: ${AUTH_JWKS_URL:http://auth-service:8080/.well-known/jwks.json}

app:
  # Internal service URLs for the category check (selection-service) and the
  # JWT sub → candidate profile resolution (candidate-service).
  selection:
    url: ${SELECTION_SERVICE_URL:http://selection-service:8080}
  candidate:
    url: ${CANDIDATE_SERVICE_URL:http://candidate-service:8080}

# Event publisher reliability (S8): outreach-service owns outreach.outbox_events
# and explicitly opts in to the event-lib outbox relay.
pullhire:
  outbox:
    enabled: true
  # Idempotency-Key creation guard (docs/api.md §1, decision C): required on
  # POST /invitations only; transitions stay key-less.
  idempotency:
    enabled: true
    path-patterns:
      - /invitations

management:
  # Observability (docs/architecture.md §7.1): expose ONLY Prometheus
  # metrics, at the literal path /metrics. Base-path `/` + path-mapping keeps
  # the public contract literal; health is served by our /healthz + /readyz.
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Structured JSON logs via Spring Boot built-in support (docs/architecture.md §7.1);
# no extra logging dependency (docs/stack.md §2).
logging:
  structured:
    format:
      console: ecs
