name: CI

# Five stages of docs/architecture.md §7.3 (S0 variant: no seed / no e2e yet).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Stage 1 — lint / format
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hygiene lint (placeholder for formatter/linter)
        run: |
          set -euo pipefail
          # Conflict markers
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- . ':!*.md'; then
            echo "::error::merge conflict markers found"; exit 1
          fi
          # .env must never be tracked (docs/deployment.md §4)
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked"; exit 1
          fi
          echo "lint ok"

  # Stage 2 — build + test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test backend
        working-directory: backend
        run: ./gradlew build --no-daemon

  # Stage 3 — OpenAPI snapshot diff
  openapi-diff:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff generated specs against baseline snapshot
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(docs/examples/openapi/*.json)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No baseline specs yet (S0); snapshot diff is a no-op until S1+."
            exit 0
          fi
          for f in "${specs[@]}"; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          echo "Baseline specs present and valid; regeneration diff lands with S1+."

  # Stage 4 — event JSON-Schema compatibility
  event-schemas:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate event schemas
        run: |
          set -euo pipefail
          shopt -s nullglob
          schemas=(contracts/events/*.json)
          if [ ${#schemas[@]} -eq 0 ]; then
            echo "No event schemas yet (S0); compatibility check is a no-op until S2."
            exit 0
          fi
          for f in "${schemas[@]}"; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          echo "Event schemas parsed; breaking-change diff lands with S2."

  # Stage 5 — Docker image build + compose smoke
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config
        run: docker compose config >/dev/null
      - name: Compose smoke (up + all /healthz = 200 + gateway)
        run: bash scripts/smoke-compose.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Compose down
        if: always()
        run: docker compose down -v
