name: CI

# Five stages of docs/architecture.md §7.3 (S0 variant: no seed / no e2e yet).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Stage 1 — lint / format
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hygiene lint (placeholder for formatter/linter)
        run: |
          set -euo pipefail
          # Conflict markers
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- . ':!*.md'; then
            echo "::error::merge conflict markers found"; exit 1
          fi
          # .env must never be tracked (docs/deployment.md §4)
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked"; exit 1
          fi
          echo "lint ok"

  # Stage 2 — build + test
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pullhire
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pullhire"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test backend
        working-directory: backend
        env:
          SELECTION_TEST_DB_URL: jdbc:postgresql://localhost:5432/pullhire?currentSchema=selection&user=postgres&password=postgres
          OUTREACH_TEST_DB_URL: jdbc:postgresql://localhost:5432/pullhire?currentSchema=outreach&user=postgres&password=postgres
          EMPLOYER_TEST_DB_URL: jdbc:postgresql://localhost:5432/pullhire?currentSchema=employer&user=postgres&password=postgres
          ASSESSMENT_TEST_DB_URL: jdbc:postgresql://localhost:5432/pullhire?currentSchema=assessment&user=postgres&password=postgres
          FSP_TEST_DB_URL: jdbc:postgresql://localhost:5432/pullhire?currentSchema=fsp&user=postgres&password=postgres
          AUTH_TEST_DB_URL: jdbc:postgresql://localhost:5432/pullhire?currentSchema=auth&user=postgres&password=postgres
          CANDIDATE_TEST_DB_URL: jdbc:postgresql://localhost:5432/pullhire?currentSchema=candidate&user=postgres&password=postgres
          NOTIFICATION_TEST_DB_URL: jdbc:postgresql://localhost:5432/pullhire?currentSchema=notification&user=postgres&password=postgres
        run: ./gradlew build --no-daemon

  # Stage 3 — OpenAPI snapshot diff
  openapi-diff:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff generated specs against baseline snapshot
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(docs/examples/openapi/*.json)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No baseline specs yet (S0); snapshot diff is a no-op until S1+."
            exit 0
          fi
          for f in "${specs[@]}"; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          echo "Baseline specs present and valid; regeneration diff lands with S1+."

  # Stage 4 — event JSON-Schema compatibility (S2)
  event-schemas:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required so the base ref (PR base sha / event.before /
      # origin/main) is present for `git show <base>:contracts/events/...`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve event-contract base ref
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push)         base="$PUSH_BEFORE_SHA" ;;
            *)            base="" ;;
          esac
          # New branch / force-push pushes have an all-zero `before` sha.
          case "$base" in
            ""|"0000000000000000000000000000000000000000")
              base="origin/main"
              ;;
          esac
          echo "event=$EVENT_NAME base=$base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Event-contract compatibility gate
        env:
          EVENT_COMPAT_BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          python3 scripts/check-event-compat.py --base "$EVENT_COMPAT_BASE"
      - name: Event-contract gate negative self-test
        run: |
          set -euo pipefail
          python3 scripts/check-event-compat-test.py

  # Stage 5 — Docker image build + compose smoke
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config
        run: docker compose config >/dev/null
      - name: Compose smoke (up + all /healthz = 200 + gateway)
        run: bash scripts/smoke-compose.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Compose down
        if: always()
        run: docker compose down -v
